<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>📊 Attendance Dashboard</h1>

    <div class="dashboard">

        <div class="card">
            <h2>Total Students</h2>
            <p id="totalStudents">0</p>
        </div>

        <div class="card">
            <h2>Present</h2>
            <p id="presentStudents">0</p>
        </div>

        <div class="card">
            <h2>Absent</h2>
            <p id="absentStudents">0</p>
        </div>

        <div class="card">
            <h2>Attendance %</h2>
            <p id="attendancePercentage">0%</p>
        </div>

    </div>

    <h2>Student Attendance</h2>

    <table>
        <tr>
            <th>Student Name</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>Sadiya</td>
            <td>Present</td>
        </tr>
    </table>

</body>

</html>
